# Business definitions: the organisation's meaning of a term, not the model's.
#
# When a question uses one of these terms, the model is told to use this exact
# expression, and the dashboard uses it too. A definition is only offered when its
# `table` and every one of its `columns` exist in the current upload.
# Editable in the app (Data view) or by hand.

[revenue]
table = "sales"
columns = ["amount", "status"]
expression = "SUM(amount) FILTER (WHERE status = 'Completed')"
meaning = "Net revenue: completed orders only. Refunded orders are excluded."

[average_order_value]
table = "sales"
columns = ["amount", "status"]
expression = "AVG(amount) FILTER (WHERE status = 'Completed')"
meaning = "Mean amount per completed order. Refunded orders are excluded."

[refund_rate]
table = "sales"
columns = ["status"]
expression = "AVG(CASE WHEN status = 'Refunded' THEN 1.0 ELSE 0.0 END)"
meaning = "Share of all orders that were refunded, between 0 and 1."
